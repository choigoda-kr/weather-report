window.toggleHourlyData = function(dateIndex) {
  const el = document.getElementById(`hourly-row-${dateIndex}`);
  if(el.classList.contains('hidden')) {
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
};

function generateHourlyChart(dateStr, hourlyTimes, hourlyPrecips, colorTheme) {
  const barColor = colorTheme === 'future' ? 'bg-amber-400' : 'bg-blue-400';
  const textColor = colorTheme === 'future' ? 'text-amber-400' : 'text-blue-400';
  
  const now = new Date();
  const hoursData = [];
  let maxPrecip = -1;
  let maxIdx = -1;
  
  for(let i=0; i<hourlyTimes.length; i++) {
    if(hourlyTimes[i].startsWith(dateStr)) {
      const itemTime = new Date(hourlyTimes[i]);
      
      // 怨쇨굅 媛뺤닔?댁뿭 紐⑤떖(history)??寃쎌슦: ?ㅻ뒛 ?좎쭨?쇰㈃ ?꾩옱 ?쒓컖 ?댁쟾源뚯?留??쒖텧
      if (colorTheme === 'history' && itemTime > now) {
        continue;
      }
      // ?ν썑 10???덉긽 紐⑤떖(future)??寃쎌슦: ?ㅻ뒛 ?좎쭨?쇰㈃ ?꾩옱 ?쒓컖 ?댄썑留??쒖텧
      if (colorTheme === 'future' && itemTime <= now) {
        continue;
      }
      
      const val = hourlyPrecips[i] || 0;
      hoursData.push({ time: hourlyTimes[i], val });
      if(val > maxPrecip) { maxPrecip = val; maxIdx = hoursData.length - 1; }
    }
  }
  
  if(hoursData.length === 0) {
    return `<div class="text-center text-xs text-slate-400 py-2">?쒓컙蹂??곗씠?곌? ?놁뒿?덈떎.<\/div>`;
  }
  
  let chartHtml = `<div class="flex overflow-x-auto gap-2 pb-2 pt-1 custom-scrollbar-hide snap-x">`;
  hoursData.forEach((d, idx) => {
    const isMax = (idx === maxIdx && maxPrecip > 0);
    const hColor = isMax ? 'bg-red-500' : barColor;
    const tColor = isMax ? 'text-red-500 font-bold' : 'text-slate-400 md:text-slate-500';
    const valColor = isMax ? 'text-red-500 font-bold' : 'text-slate-600 md:text-slate-400';
    
    let hPx = 2;
    if(maxPrecip > 0 && d.val > 0) {
      hPx = Math.max(2, Math.floor((d.val / maxPrecip) * 36)); 
    }
    
    const hourStr = d.time.substring(11, 16); 
    const valStr = d.val > 0 ? d.val.toFixed(1) : '0';
    
    chartHtml += `
      <div class="flex flex-col items-center justify-end min-w-[36px] snap-center">
        <span class="text-[10px] mb-1 ${valColor}">${valStr}<\/span>
        <div class="w-4 rounded-t-sm ${hColor}" style="height: ${hPx}px; transition: height 0.3s ease;"><\/div>
        <span class="text-[9px] mt-1 ${tColor}">${hourStr}<\/span>
      <\/div>
    `;
  });
  chartHtml += `<\/div>`;
  
  if(maxPrecip > 0) {
    const peakTime = hoursData[maxIdx].time.substring(11, 16);
    chartHtml = `<div class="text-[11px] mb-2 text-red-500 font-bold tracking-tight"><i class="fa-solid fa-triangle-exclamation"><\/i> ${peakTime} ?쇳겕 吏묒쨷 媛뺤닔 (${maxPrecip.toFixed(1)}mm)<\/div>` + chartHtml;
  }
  return chartHtml;
}

window.showNext24hModal = function(name, hourlyTimes, hourlyPrecips) {

  const nowMs = Date.now();
  const next24hMs = nowMs + (24 * 60 * 60 * 1000);
  
  let hasData = false;

    hourlyTimes.forEach((t, i) => {
      const timeMs = new Date(t).getTime();

        const val = hourlyPrecips[i] !== null && hourlyPrecips[i] !== undefined ? Number(hourlyPrecips[i]) : 0;

        const dateStr = t.substring(5, 10).replace('-', '/'); // "01/01"

  }
  
  document.getElementById('modal-total').innerText = sum.toFixed(1);
  document.getElementById('detail-modal').showModal();
};

async function fetchSubRegionData(cityId, cityName, startDateStr, endDateStr) {
  const regions = window.subRegionsData ? window.subRegionsData[cityId] : null;
  if (!regions || regions.length === 0) {
    window.showToast(`${cityName}???몃? 吏???곗씠?곌? ?놁뒿?덈떎.`, true);
    return null;
  }
  
  const lats = regions.map(l => l.lat).join(',');
  const lons = regions.map(l => l.lon).join(',');
  
  const todayDate = new Date();
  const offset = todayDate.getTimezoneOffset() * 60000;
  const todayIso = (new Date(todayDate - offset)).toISOString().split('T')[0];
  const futureDate = new Date(todayDate);
  futureDate.setDate(futureDate.getDate() + 11);
  const futureIso = (new Date(futureDate - offset)).toISOString().split('T')[0];
  
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lats + '&longitude=' + lons + '&hourly=precipitation&daily=precipitation_sum&timezone=Asia%2FSeoul&past_days=14&forecast_days=14';
  
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('API Error ' + res.status);
    let results = await res.json();
    if (!Array.isArray(results)) results = [results];
    
    return regions.map((loc, index) => {
      const data = results[index] || {};
      let historyTotal = 0;
      
      const futureDates = [];
      const futurePrecips = [];
      
      const now = new Date();
      
      if (data.daily && data.daily.time) {
        data.daily.time.forEach((t, i) => {
          const p = data.daily.precipitation_sum[i] || 0;
          
          if (t === todayIso) {
            let todayHistorySum = 0;
            let todayFutureSum = 0;
            
            const hourlyTimes = data.hourly?.time || [];
            const hourlyPrecips = data.hourly?.precipitation || [];
            
            hourlyTimes.forEach((ht, hidx) => {
              if (ht.startsWith(todayIso)) {
                const htDate = new Date(ht);
                const val = hourlyPrecips[hidx] || 0;
                if (htDate <= now) {
                  todayHistorySum += val;
                } else {
                  todayFutureSum += val;
                }
              }
            });
            
            if (t >= startDateStr && t <= endDateStr) {
              historyTotal += todayHistorySum;
            }
            if (t >= todayIso && futureDates.length < 10) {
              futureDates.push(t);
              futurePrecips.push(todayFutureSum);
            }
          } else {
            if (t >= startDateStr && t <= endDateStr) {
              historyTotal += p;
            }
            if (t >= todayIso && futureDates.length < 10) {
              futureDates.push(t);
              futurePrecips.push(p);
            }
          }
        });
      }
      const next10dPrecip = futurePrecips.reduce((sum, val) => sum + (val || 0), 0);
      
      const nowMs = Date.now();
      const next24hMs = nowMs + (24 * 60 * 60 * 1000);
      let next24hSum = 0;
      
      const hourlyTimes = data.hourly?.time || [];
      const hourlyPrecips = data.hourly?.precipitation || [];
      hourlyTimes.forEach((t, i) => {
        const timeMs = new Date(t).getTime();
        if (timeMs >= nowMs && timeMs <= next24hMs) {
          next24hSum += (hourlyPrecips[i] || 0);
        }
      });
      
      return {
        ...loc,
        totalPrecip: historyTotal.toFixed(1),
        next24hPrecip: next24hSum.toFixed(1),
        next10dPrecip: next10dPrecip.toFixed(1)
      };
    });
  } catch(e) {
    console.error(e);
    return null;
  }
}

/**

 * @param {string} name  - 吏?먮챸

window.showMapModal = function(name, lat, lon, condition, temp) {

  // 1. 醫뚰몴 ?좏슚??寃??  if (lat == null || lon == null || isNaN(Number(lat)) || isNaN(Number(lon))) {
    alert(`[遺덈윭?ㅺ린 ?ㅽ뙣] ${name} 吏?먯쓽 ?꾩튂 醫뚰몴媛 ?놁뼱 吏?꾨? ?쒖떆?????놁뒿?덈떎.`);
    return;
  }

  // 2. 紐⑤떖 ??댄? 媛깆떊
  document.getElementById('map-modal-title-text').textContent = `${name} ?꾩튂 吏??;
  document.getElementById('map-modal-info').textContent = `${condition} | ${temp !== '-' ? temp + '째C' : '-'} | ${lat.toFixed(4)}째N  ${lon.toFixed(4)}째E`;

  // 3. 吏??紐⑤떖 ?닿린
  document.getElementById('map-modal').showModal();

  // 4. 湲곗〈 ?몄뒪?댁뒪 ?쒓굅 (以묐났 珥덇린??諛⑹?) ??showModal() 吏곹썑, setTimeout 諛뽰뿉???좏뻾 泥섎━
  if (window._leafletMap) {
    try { window._leafletMap.remove(); } catch(e) { /* ignore */ }
    window._leafletMap = null;
  }

  // 5. ?湲?以?濡쒕뵫 ?ㅽ뵾???쒖떆 (300ms ?湲??숈븞 UX 媛쒖꽑)
  const mapEl = document.getElementById('map-container');
  mapEl.innerHTML = `
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; color:#94a3b8;">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem; color:#059669;"><\/i>
      <p style="font-size:12px; font-weight:500;">吏?꾨? 遺덈윭?ㅻ뒗 以?..<\/p>
    <\/div>
  `;

  // 6. [?듭떖 ?섏젙] Leaflet 珥덇린???꾩껜瑜?setTimeout 300ms ?덉쑝濡??대룞
  //    showModal()? ?숆린?곸쑝濡?open ?띿꽦留?異붽???肉?
  //    釉뚮씪?곗????덉씠?꾩썐(由ы뵆濡쒖슦/?섏씤?? ?꾨즺瑜?蹂댁옣?섏? ?딆쓬.
  //    利됱떆 珥덇린????map-container???ш린媛 0?대씪 Leaflet ?먮윭 諛쒖깮.
  //    300ms ?湲곕줈 ?뚮뜑留??꾨즺 ??珥덇린?뷀븯??洹쇰낯 ?닿껐.
  setTimeout(() => {

    try {
      mapEl.innerHTML = ''; // 濡쒕뵫 ?ㅽ뵾???쒓굅

      window._leafletMap = L.map('map-container', {
        center: [lat, lon],
        zoom: 11,
        zoomControl: true,
        scrollWheelZoom: true
      });

      // OpenStreetMap ????덉씠??      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap<\/a>'
      }).addTo(window._leafletMap);

      // 留덉빱 異붽?
      const marker = L.marker([lat, lon]).addTo(window._leafletMap);

      // ?앹뾽 ?댁슜 (吏?먮챸 쨌 湲곗긽 쨌 湲곗삩 쨌 醫뚰몴)
      const popupContent = `
        <div style="font-family: 'Noto Sans KR', sans-serif; min-width: 130px;">
          <div style="font-size: 14px; font-weight: 700; color: #1D1D1F; margin-bottom: 4px;">?뱧 ${name}<\/div>
          <div style="font-size: 12px; color: #555; line-height: 1.7;">
            湲곗긽: <b>${condition}<\/b><br>
            湲곗삩: <b>${temp !== '-' ? temp + '째C' : '?뺣낫 ?놁쓬'}<\/b><br>
            <span style="color: #aaa; font-size: 10px;">${lat.toFixed(4)}째N, ${lon.toFixed(4)}째E<\/span>
          <\/div>
        <\/div>
      `;
      marker.bindPopup(popupContent, { maxWidth: 220 }).openPopup();

      // 而⑦뀒?대꼫 ?ш린 ?ш퀎??(dialog ?덉씠?꾩썐 理쒖쥌 ?덉젙??
      window._leafletMap.invalidateSize();

    } catch (err) {
      // Leaflet 珥덇린???ㅽ뙣 ???ъ슜??移쒗솕???먮윭 ?쒖떆
      console.error('[showMapModal] Leaflet 珥덇린???ㅽ뙣:', err);
      mapEl.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:8px; color:#ef4444;">
          <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;"><\/i>
          <p style="font-size:13px; font-weight:600;">吏?꾨? 遺덈윭?ㅻ뒗???ㅽ뙣?덉뒿?덈떎.<\/p>
          <p style="font-size:11px; color:#94a3b8;">?ㅽ듃?뚰겕 ?곹깭瑜??뺤씤 ???ㅼ떆 ?쒕룄??二쇱꽭??<\/p>
        <\/div>
      `;
    }

  }, 300); // 300ms: <dialog> ?뚮뜑留?諛?CSS ?좊땲硫붿씠???꾨즺 ?湲?}

window.toggleModalFullscreen = function() {
  const modalBox = document.querySelector('#detail-modal > div');
  const icon = document.getElementById('modal-fs-icon');
  
  modalBox.classList.toggle('modal-fullscreen');
  
  if (modalBox.classList.contains('modal-fullscreen')) {
    icon.classList.remove('fa-expand');
    icon.classList.add('fa-compress');
  } else {
    icon.classList.remove('fa-compress');
    icon.classList.add('fa-expand');
  }
};
