// Open-Meteo WMO Code ?뚯떛 ?⑥닔
function getWeatherCondition(code) {
  switch (true) {
    case code === 0: return { text: '留묒쓬', icon: 'fa-sun', color: 'text-amber-500 md:text-yellow-400' };
    case code === 1: return { text: '?泥대줈 留묒쓬', icon: 'fa-cloud-sun', color: 'text-orange-500 md:text-yellow-300' };
    case code === 2: return { text: '援щ쫫議곌툑', icon: 'fa-cloud', color: 'text-slate-500 md:text-slate-300' };
    case code === 3: return { text: '?먮┝', icon: 'fa-cloud', color: 'text-slate-600 md:text-slate-400' };
    case (code >= 45 && code <= 48): return { text: '?덇컻', icon: 'fa-smog', color: 'text-slate-500 md:text-slate-400' };
    case (code >= 51 && code <= 55): return { text: '?댁뒳鍮?, icon: 'fa-cloud-rain', color: 'text-blue-500 md:text-blue-300' };
    case (code >= 61 && code <= 65): return { text: '鍮?, icon: 'fa-cloud-showers-heavy', color: 'text-blue-600 md:text-blue-500' };
    case (code >= 71 && code <= 77): return { text: '??, icon: 'fa-snowflake', color: 'text-sky-500 md:text-white' };
    case (code >= 80 && code <= 82): return { text: '?뚮굹湲?, icon: 'fa-cloud-showers-water', color: 'text-blue-500 md:text-blue-400' };
    case (code >= 95 && code <= 99): return { text: '?뚯슦', icon: 'fa-cloud-bolt', color: 'text-indigo-600 md:text-yellow-500' };
    default: return { text: '?뚯닔?놁쓬', icon: 'fa-circle-question', color: 'text-slate-500 md:text-slate-500' };
  }
}

// ?꾩뿭 Toast 硫붿떆吏 ?⑥닔
window.showToast = function(message, isError = false) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  
  const toast = document.createElement('div');
  const bgColor = isError ? 'bg-red-500' : 'bg-slate-800 md:bg-blue-600';
  const icon = isError ? '<i class="fa-solid fa-triangle-exclamation"><\/i>' : '<i class="fa-solid fa-circle-info"><\/i>';
  
  toast.className = `flex items-center gap-2 px-4 py-3 text-white text-sm font-medium rounded shadow-lg transition-all duration-300 transform translate-y-4 opacity-0 ${bgColor}`;
  toast.innerHTML = `${icon} <span>${message}<\/span>`;
  
  container.appendChild(toast);
  
  // ?섏씠?쒖씤 ?좊땲硫붿씠??  requestAnimationFrame(() => {
    toast.classList.remove('translate-y-4', 'opacity-0');
  });
  
  // 3珥????섏씠?쒖븘??諛??쒓굅
  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => {
      if(container.contains(toast)) {
        container.removeChild(toast);
      }
    }, 300);
  }, 3000);
};

// 2. Fetch 諛?Mapping 濡쒖쭅 援ъ“??async function fetchWeatherData(startDateStr, endDateStr, forceRefresh = false) {
  const CACHE_TTL = 60 * 60 * 1000; // 60遺?TTL
  const cacheKey = `weather_data_v4_${startDateStr}_${endDateStr}`;
  const cached = sessionStorage.getItem(cacheKey);

  const urlParamsForCache = new URLSearchParams(window.location.search);
  const isTestMode = urlParamsForCache.get('mode') === 'test_rain';

  if (!isTestMode && !forceRefresh && cached) {
    const data = JSON.parse(cached);
    if (Date.now() - data.timestamp < CACHE_TTL) {
      console.log('Using cached data for', startDateStr, 'to', endDateStr);
      updateLastTimeString();
      document.getElementById('loading-indicator').classList.add('hidden');
      return data.payload;
    }
  }

  // 濡쒕뵫 ?곹깭 ?쒖옉
  document.getElementById('loading-indicator').classList.remove('hidden');

  try {
    const lats = locations.map(l => l.lat).join(',');
    const lons = locations.map(l => l.lon).join(',');
    const locNamesStr = locations.map(l => l.name).join(',');
    
    console.log('Fetching Hybrid Data via GAS Backend...');
    let results;
    
    // 濡쒖뺄/?뚯뒪???섍꼍?먯꽌 google 媛앹껜媛 ?놁쓣 寃쎌슦瑜??鍮?    if (typeof google === 'undefined' || typeof google.script === 'undefined') {
        throw new Error("GAS ?섍꼍(google.script.run)??李얠쓣 ???놁뒿?덈떎.");
    }
    
    results = await new Promise((resolve, reject) => {
        google.script.run
            .withSuccessHandler((res) => {
                try {
                    resolve(JSON.parse(res));
                } catch(e) { reject(e); }
            })
            .withFailureHandler(reject)
            .getMergedWeatherData(lats, lons, locNamesStr, startDateStr, endDateStr);
    });

    // ?곗씠???뺢퇋??Mapping) 泥섎━
    const processedData = locations.map((loc, index) => {
        const data = results[index] || {};
        
        // 1. 湲곗긽 ?곹깭 諛??ㅽ솴 ?곗씠???뚯떛
        const currentTemp = data.current?.temp !== undefined ? Number(data.current.temp).toFixed(1) : '-';
        // AWS?먯꽌 ?쒕쾭媛 怨꾩궛?댁? 怨쇨굅 ?꾩쟻 媛뺤닔???ъ슜 (?놁쑝硫?0.0)
        const totalPrecip = data.historyTotal !== undefined ? Number(data.historyTotal).toFixed(1) : '0.0';
        
        // 湲곗긽 肄붾뱶媛 ?놁쑝誘濡?媛뺤닔 ?щ?濡?留묒쓬(0)/鍮?61) ?꾩떆 ?泥?        const conditionCode = (parseFloat(totalPrecip) > 0) ? 61 : 0;
        const condition = getWeatherCondition(conditionCode); 

        // 2. ?ν썑 24?쒓컙 媛뺤닔??(湲곗긽泥??④린?덈낫)
        let next24hSum = 0;
        const targetPrecips = [];
        const hourlyTimes = [];
        const hourlyPrecips = [];
        
        if (data.forecast24h && data.forecast24h.precip_hourly) {
            data.forecast24h.precip_hourly.forEach(p => {
                let pValue = parseFloat(p.value);
                if (isNaN(pValue)) {
                   if (p.value === "媛뺤닔?놁쓬") pValue = 0;
                   else pValue = 0;
                }
                next24hSum += pValue;
                targetPrecips.push(pValue);
                
                // ?좎쭨 ?щ㎎ 蹂??(YYYYMMDD -> YYYY-MM-DDT...)
                const dtStr = p.date.replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3") + "T" + p.time.substring(0,2) + ":00";
                hourlyTimes.push(dtStr);
                hourlyPrecips.push(pValue);
            });
        }
        const next24hPrecip = next24hSum.toFixed(1);

        // 3. ?ν썑 10??媛뺤닔??(Open-Meteo ?좎?)
        let next10dSum = 0;
        const futureDates = data.forecast10d?.time || [];
        const futurePrecips = data.forecast10d?.precipitation_sum || [];
        futurePrecips.forEach(p => next10dSum += (p || 0));
        const next10dPrecip = next10dSum.toFixed(1);
        
        const futureHourlyTimes = data.forecast10dHourly?.time || [];
        const futureHourlyPrecips = data.forecast10dHourly?.precipitation || [];

        // 4. Sliding Window 寃쎈낫 ?덈꺼 ?먮퀎 (1?쒓컙 50mm, 3?쒓컙 90mm ??
        let alertLevel = 'none';
        for (let i = 0; i < targetPrecips.length; i++) {
            const p1 = targetPrecips[i];
            const p2 = i + 1 < targetPrecips.length ? targetPrecips[i + 1] : 0;
            const p3 = i + 2 < targetPrecips.length ? targetPrecips[i + 2] : 0;
            const sum3h = p1 + p2 + p3;
            if (sum3h >= 90 || p1 >= 50) {
                alertLevel = 'red'; break;
            } else if ((sum3h >= 60 || p1 >= 30) && alertLevel !== 'red') {
                alertLevel = 'orange';
            }
        }

        return {
            ...loc,
            condition,
            currentTemp,
            totalPrecip,
            next24hPrecip,
            next10dPrecip,
            alertLevel,
            dailyDates: data.dailyDates || [],
            dailyPrecips: data.dailyPrecips || [],
            futureDates: futureDates,
            futurePrecips: futurePrecips,
            futureHourlyTimes: futureHourlyTimes,
            futureHourlyPrecips: futureHourlyPrecips,
            hourlyTimes: hourlyTimes,
            hourlyPrecips: hourlyPrecips,
            historyHourlyTimes: data.historyHourlyTimes || [],
            historyHourlyPrecips: data.historyHourlyPrecips || []
        };
    });

    // SessionStorage 罹먯떛 ???    sessionStorage.setItem(cacheKey, JSON.stringify({
      timestamp: Date.now(),
      payload: processedData
    }));

    // [?뺤떇 湲곕뒫] URL ?뚮씪誘명꽣 ?mode=test_rain 湲곗긽 寃쎈낫 ?쒖뒪???뚯뒪??紐⑤뱶
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'test_rain' && processedData && processedData.length >= 2) {
      console.log('[Mock Mode] ?mode=test_rain ?몄슦 寃쎈낫 ?쒖뒪??媛???뚯뒪??媛??);
      
      // 1. 怨쇱쿇 (index 0) -> 二쇱쓽蹂?orange) 二쇱엯
      processedData[0].alertLevel = 'orange';
      
      // 2. ?ъ＜ (index 1) -> 寃쎈낫(red) 二쇱엯 諛?1?쒓컙 媛뺤닔??55.5mm ?꾩떆 異붽??섏뿬 湲닿툒 紐⑤떖 ?몃━嫄?      processedData[1].alertLevel = 'red';
      
      const futureHour = new Date(Date.now() + 2 * 60 * 60 * 1000);
      const offset = futureHour.getTimezoneOffset() * 60000;
      const futureLocalStr = new Date(futureHour - offset).toISOString().substring(0, 16);
      
      processedData[1].hourlyTimes.push(futureLocalStr);
      processedData[1].hourlyPrecips.push(55.5);
    }

    document.getElementById('loading-indicator').classList.add('hidden');
    updateLastTimeString();

    return processedData;
    
  } catch (error) {
    console.error('[GAS Fetch Exception]', error);
    document.getElementById('loading-indicator').classList.add('hidden');
    window.showToast('?곗씠??濡쒕뱶 ?ㅽ뙣 (GAS ?섍꼍 ?뺤씤 ?붾쭩)', true);
    return null;
  }
}

function updateLastTimeString() {
  const now = new Date();
  document.getElementById('last-updated').innerText = `理쒖쥌 媛깆떊: ${now.toLocaleTimeString('ko-KR')}`;
}

          <\/button>
        <\/div>
        
        <!-- ?곗륫: 湲곗삩 + ?좎뵪 ?꾩씠肄??명듃 -->
        <div class="flex items-center gap-3 sm:gap-4">
          <span class="text-xl sm:text-2xl font-bold text-[#1D1D1F] md:text-slate-200 tracking-tight shrink-0">${data.currentTemp} <span class="text-sm sm:text-base font-normal">째C<\/span><\/span>
          <div class="flex flex-col items-center shrink-0">

      <div class="space-y-3 mt-auto">

function checkEmergencyRain(dataArray) {
  const threshold = 50.0;
  const emergencyLogs = [];
  const affectedLocations = new Set();
  const now = Date.now();
  
  dataArray.forEach(loc => {
    if (!loc.hourlyTimes || !loc.hourlyPrecips) return;
    loc.hourlyTimes.forEach((timeStr, i) => {
      const precip = loc.hourlyPrecips[i];
      if (precip >= threshold) {
        const [datePart, timePart] = timeStr.split('T');
        const targetTime = new Date(timeStr).getTime();
        
        // 怨쇨굅 ?곗씠???쒖쇅 (?꾩옱 ?쒓컖 ?댄썑留?
        if (targetTime >= now) {
          affectedLocations.add(loc.name);
          emergencyLogs.push({
            name: loc.name,
            date: datePart,
            time: timePart,
            precip: precip
          });
        }
      }
    });
  });
  
  if (emergencyLogs.length > 0) {
    const locsArray = Array.from(affectedLocations).join(', ');
    document.getElementById('emergency-modal-title').innerHTML = `<i class="fa-solid fa-triangle-exclamation"><\/i> 湲닿툒: ${locsArray}??媛뺥븳 ?몄슦 ?덉긽??;
    
    const tbody = document.getElementById('emergency-modal-tbody');
    tbody.innerHTML = '';
    
    // ?쒓컙???뺣젹
    emergencyLogs.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
    
    emergencyLogs.forEach(log => {
      tbody.innerHTML += `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="px-4 py-3 font-bold text-slate-800">${log.name}<\/td>
          <td class="px-4 py-3 text-slate-600">${log.date}<\/td>
          <td class="px-4 py-3 text-slate-600">${log.time}<\/td>
          <td class="px-4 py-3 text-right font-mono font-bold text-red-600">${Number(log.precip).toFixed(1)}<\/td>
        <\/tr>
      `;
    });
    
    document.getElementById('emergency-modal').showModal();
  }
}
