<script>
/**
 * 지도 자산 지연 로딩
 *
 * Leaflet(약 160KB)은 MAP 모달 안에서만 쓰인다. 그런데 원본 화면은 이를
 * 첫 로딩에 무조건 받아, 지도를 한 번도 열지 않는 대표님도 그 비용을 치른다.
 * 여기서는 MAP을 실제로 누르는 순간에만 받도록 미룬다.
 *
 * 화면 코드(JS_UI)는 건드리지 않는다. 이미 정의된 showMapModal 을 감싸서
 * 자산이 준비된 뒤에 원래 함수를 그대로 호출한다.
 *
 * 지도 툴팁이 쓰는 Noto Sans KR 도 같은 시점에 불러온다.
 * 첫 화면에는 이 글꼴을 쓰는 요소가 없으므로 모양은 달라지지 않는다.
 */
(function () {
  'use strict';

  var MAP_ASSETS = {
    css: ['./assets/leaflet.css',
          'https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap'],
    js:  ['./assets/leaflet.js']
  };

  var pending = null;

  function loadCss(href) {
    return new Promise(function (resolve) {
      var el = document.createElement('link');
      el.rel = 'stylesheet';
      el.href = href;
      // 스타일이 늦어도 지도 자체는 뜨므로, 실패해도 진행을 막지 않는다.
      el.onload = el.onerror = function () { resolve(); };
      document.head.appendChild(el);
    });
  }

  function loadJs(src) {
    return new Promise(function (resolve, reject) {
      var el = document.createElement('script');
      el.src = src;
      el.onload = function () { resolve(); };
      el.onerror = function () { reject(new Error(src + ' 불러오기 실패')); };
      document.head.appendChild(el);
    });
  }

  function ensureMapAssets() {
    if (window.L && window.L.map) return Promise.resolve();
    if (pending) return pending;
    pending = Promise.all(MAP_ASSETS.css.map(loadCss))
      .then(function () { return Promise.all(MAP_ASSETS.js.map(loadJs)); })
      .then(function () {
        if (!window.L || !window.L.map) throw new Error('지도 라이브러리를 초기화하지 못했습니다.');
      })
      .catch(function (err) {
        pending = null; // 다음 클릭 때 다시 시도할 수 있게 한다.
        throw err;
      });
    return pending;
  }

  var original = window.showMapModal;
  if (typeof original !== 'function') {
    console.error('[지도 지연 로딩] showMapModal 을 찾지 못해 적용하지 않았습니다.');
    return;
  }

  window.showMapModal = function () {
    var args = arguments;
    ensureMapAssets().then(function () {
      original.apply(this, args);
    }).catch(function (err) {
      console.error('[지도 지연 로딩]', err);
      alert('지도를 불러오지 못했습니다. 잠시 후 다시 눌러 주십시오.');
    });
  };

  // 대표님이 MAP을 누르실 가능성이 높으므로, 화면이 다 뜬 뒤 한가할 때 미리 받아 둔다.
  // 첫 화면 표출에는 영향을 주지 않으면서 첫 클릭의 대기 시간을 없앤다.
  var warm = function () { ensureMapAssets().catch(function () {}); };
  if ('requestIdleCallback' in window) {
    window.addEventListener('load', function () { requestIdleCallback(warm, { timeout: 5000 }); });
  } else {
    window.addEventListener('load', function () { setTimeout(warm, 2000); });
  }
})();
</script>
