<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경기지역본부 기상상황실</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
  }
  header {
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid #1e293b;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 800;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 0.75rem;
    color: #94a3b8;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 6px 12px;
    white-space: nowrap;
  }
  .cta {
    font-size: 0.8rem;
    color: #fff;
    background: #2563eb;
    border-radius: 8px;
    padding: 8px 14px;
    text-decoration: none;
    white-space: nowrap;
  }
  .cta:hover { background: #1d4ed8; }
  main { padding: 16px 20px 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card.alert-red { border-color: #ef4444; box-shadow: 0 0 16px rgba(239,68,68,0.35); }
  .card.alert-orange { border-color: #f97316; box-shadow: 0 0 16px rgba(249,115,22,0.3); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .city { font-size: 1.05rem; font-weight: 700; }
  .cond-emoji { font-size: 1.6rem; }
  .cond-text { font-size: 0.75rem; color: #94a3b8; }
  .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; }
  .stat-value { color: #e2e8f0; font-weight: 600; }
  .alert-tag {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    width: fit-content;
  }
  .alert-tag.red { background: #ef4444; color: #fff; }
  .alert-tag.orange { background: #f97316; color: #fff; }
  .skeleton {
    background: linear-gradient(90deg, #1e293b 25%, #263449 37%, #1e293b 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 16px;
    height: 120px;
  }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .empty-msg { text-align: center; color: #64748b; padding: 40px 0; font-size: 0.9rem; }
</style>
</head>
<body>
  <header>
    <h1>🌦️ 경기지역본부 기상상황실</h1>
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <span class="badge" id="last-updated">최종 갱신: 확인 중...</span>
      <a class="cta" href="https://script.google.com/macros/s/AKfycbxRG65-0mK7IZE_n9j8zjl2xxDE2VpuUbGUkDEeQrdhpfG6aPKgYHtSEeWSD02CL1Z7/exec">기간 조회·상세 기능은 상황실로 →</a>
    </div>
  </header>
  <main>
    <div class="grid" id="weather-grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>

  <script>
    function getCondition(code) {
      if (code === 0) return { text: '맑음', emoji: '☀️' };
      if (code === 1) return { text: '대체로 맑음', emoji: '🌤️' };
      if (code === 2) return { text: '구름조금', emoji: '⛅' };
      if (code === 3) return { text: '흐림', emoji: '☁️' };
      if (code >= 45 && code <= 48) return { text: '안개', emoji: '🌫️' };
      if (code >= 51 && code <= 55) return { text: '이슬비', emoji: '🌦️' };
      if (code >= 61 && code <= 65) return { text: '비', emoji: '🌧️' };
      if (code >= 71 && code <= 77) return { text: '눈', emoji: '❄️' };
      if (code >= 80 && code <= 82) return { text: '소나기', emoji: '🌧️' };
      if (code >= 95 && code <= 99) return { text: '뇌우', emoji: '⛈️' };
      return { text: '정보없음', emoji: '❓' };
    }

    function alertClass(alertStatus) {
      if (!alertStatus) return null;
      if (alertStatus.startsWith('호우경보')) return 'red';
      if (alertStatus.startsWith('호우주의보') || alertStatus.startsWith('예비특보')) return 'orange';
      return null;
    }

    function renderCards(payload) {
      const grid = document.getElementById('weather-grid');
      if (!payload || payload.length === 0) {
        grid.innerHTML = '<div class="empty-msg">데이터를 불러오지 못했습니다. 상황실 전체 화면을 이용해 주세요.</div>';
        return;
      }
      grid.innerHTML = payload.map(d => {
        const cond = getCondition(d.current && d.current.code);
        const temp = (d.current && d.current.temp !== undefined) ? Number(d.current.temp).toFixed(1) : '-';
        const historyTotal = d.historyTotal !== undefined ? Number(d.historyTotal).toFixed(1) : '0.0';
        const aClass = alertClass(d.alertStatus);
        const alertHtml = aClass ? `<span class="alert-tag ${aClass}">${d.alertStatus}</span>` : '';
        return `
          <div class="card ${aClass ? 'alert-' + aClass : ''}">
            <div class="card-top">
              <div>
                <div class="city">${d.city}</div>
                <div class="cond-text">${cond.text}</div>
              </div>
              <div class="cond-emoji">${cond.emoji}</div>
            </div>
            <div class="stat-row"><span>현재 기온</span><span class="stat-value">${temp}℃</span></div>
            <div class="stat-row"><span>기간 누적강수량</span><span class="stat-value">${historyTotal}mm</span></div>
            ${alertHtml}
          </div>`;
      }).join('');
    }

    function updateLastUpdated(generatedAt) {
      const el = document.getElementById('last-updated');
      if (!generatedAt) { el.textContent = '최종 갱신: 알 수 없음'; return; }
      const ageMin = Math.max(0, Math.round((Date.now() - new Date(generatedAt).getTime()) / 60000));
      el.textContent = `최종 갱신: ${ageMin}분 전`;
    }

    fetch('./data/weather-latest.json', { cache: 'no-store' })
      .then(res => { if (!res.ok) throw new Error('fetch failed'); return res.json(); })
      .then(data => {
        renderCards(data.payload);
        updateLastUpdated(data.generatedAt);
      })
      .catch(() => {
        document.getElementById('weather-grid').innerHTML =
          '<div class="empty-msg">스냅샷 데이터를 불러오지 못했습니다. 상단 버튼으로 전체 상황실을 이용해 주세요.</div>';
        document.getElementById('last-updated').textContent = '최종 갱신: 실패';
      });
  </script>
</body>
</html>
