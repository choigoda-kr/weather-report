<script>
// 1. 20개 지점 데이터 셋 구축 (광역 4개 신규 + 기존 16개 유지)
const locations = [
  { id: 'incheon', name: '인천', lat: 37.4777, lon: 126.6249 }, // 인천(112) ASOS
  { id: 'yeoju', name: '여주', lat: 37.2917, lon: 127.6372 }, // 여주(465) AWS
  { id: 'icheon', name: '이천', lat: 37.2640, lon: 127.4842 }, // 이천(203) ASOS
  { id: 'yangpyeong', name: '양평', lat: 37.4886, lon: 127.4944 }, // 양평(202) ASOS
  { id: 'hwaseong', name: '화성', lat: 37.1651, lon: 126.8285 }, // 화성(488) AWS
  { id: 'suwon', name: '수원', lat: 37.2574, lon: 126.9830 }, // 수원(119) ASOS
  { id: 'yeoncheon', name: '연천', lat: 38.0964, lon: 127.0744 }, // 연천(491) AWS
  { id: 'pocheon', name: '포천', lat: 37.8949, lon: 127.2003 }, // 포천(473) AWS
  { id: 'paju', name: '파주', lat: 37.8859, lon: 126.7661 }, // 파주(99) ASOS
  { id: 'goyang', name: '고양', lat: 37.6401, lon: 126.8322 }, // 고양(540) AWS
  { id: 'ganghwa', name: '강화', lat: 37.7074, lon: 126.4463 }, // 강화(201) ASOS
  /* { id: 'ongjin', name: '옹진', lat: 37.9660, lon: 124.6305 }, // 백령도(102) ASOS (제외 처리) */
  { id: 'gimpo', name: '김포', lat: 37.6049, lon: 126.7151 }, // 김포(441) AWS
  { id: 'pyeongtaek', name: '평택', lat: 36.9926, lon: 127.1129 }, // 평택(356) AWS
  { id: 'yongin', name: '용인', lat: 37.2411, lon: 127.1774 }, // 용인(549) AWS
  { id: 'anseong', name: '안성', lat: 37.0116, lon: 127.2758 }  // 안성(470) AWS
];

// Open-Meteo WMO Code 파싱 함수
function getWeatherCondition(code) {
  switch (true) {
    case code === 0: return { text: '맑음', icon: 'fa-sun', color: 'text-amber-500 md:text-yellow-400' };
    case code === 1: return { text: '대체로 맑음', icon: 'fa-cloud-sun', color: 'text-orange-500 md:text-yellow-300' };
    case code === 2: return { text: '구름조금', icon: 'fa-cloud', color: 'text-slate-500 md:text-slate-300' };
    case code === 3: return { text: '흐림', icon: 'fa-cloud', color: 'text-slate-600 md:text-slate-400' };
    case (code >= 45 && code <= 48): return { text: '안개', icon: 'fa-smog', color: 'text-slate-500 md:text-slate-400' };
    case (code >= 51 && code <= 55): return { text: '이슬비', icon: 'fa-cloud-rain', color: 'text-blue-500 md:text-blue-300' };
    case (code >= 61 && code <= 65): return { text: '비', icon: 'fa-cloud-showers-heavy', color: 'text-blue-600 md:text-blue-500' };
    case (code >= 71 && code <= 77): return { text: '눈', icon: 'fa-snowflake', color: 'text-sky-500 md:text-white' };
    case (code >= 80 && code <= 82): return { text: '소나기', icon: 'fa-cloud-showers-water', color: 'text-blue-500 md:text-blue-400' };
    case (code >= 95 && code <= 99): return { text: '뇌우', icon: 'fa-cloud-bolt', color: 'text-indigo-600 md:text-yellow-500' };
    default: return { text: '알수없음', icon: 'fa-circle-question', color: 'text-slate-500 md:text-slate-500' };
  }
}

// 전역 Toast 메시지 함수
window.showToast = function(message, isError = false) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  
  const toast = document.createElement('div');
  const bgColor = isError ? 'bg-red-500' : 'bg-slate-800 md:bg-blue-600';
  const icon = isError ? '<i class="fa-solid fa-triangle-exclamation"><\/i>' : '<i class="fa-solid fa-circle-info"><\/i>';
  
  toast.className = `flex items-center gap-2 px-4 py-3 text-white text-sm font-medium rounded shadow-lg transition-all duration-300 transform translate-y-4 opacity-0 ${bgColor}`;
  toast.innerHTML = `${icon} <span>${message}<\/span>`;
  
  container.appendChild(toast);
  
  // 페이드인 애니메이션
  requestAnimationFrame(() => {
    toast.classList.remove('translate-y-4', 'opacity-0');
  });
  
  // 3초 후 페이드아웃 및 제거
  setTimeout(() => {
    toast.classList.add('opacity-0', 'translate-y-2');
    setTimeout(() => {
      if(container.contains(toast)) {
        container.removeChild(toast);
      }
    }, 300);
  }, 3000);
};

window.getPeriodText = function(sDateStr, eDateStr) {
  if (!sDateStr || !eDateStr) return '선택 기간';
  const s = new Date(sDateStr);
  const e = new Date(eDateStr);
  const diffDays = Math.ceil(Math.abs(e - s) / (1000 * 60 * 60 * 24)) + 1;
  const today = new Date();
  const offset = today.getTimezoneOffset() * 60000;
  const todayStr = (new Date(today - offset)).toISOString().split('T')[0];
  
  if (eDateStr === todayStr) {
      return `최근 ${diffDays}일`;
  } else {
      return `${diffDays}일간`;
  }
};

// 현재 조회기간이 첫 화면 기본값(어제~오늘)과 일치하는지 판별
function isDefaultDateRange(startDateStr, endDateStr) {
  const fmt = d => {
    const offset = d.getTimezoneOffset() * 60000;
    return (new Date(d - offset)).toISOString().split('T')[0];
  };
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  return startDateStr === fmt(yesterday) && endDateStr === fmt(today);
}

// GitHub Actions가 주기적으로 커밋해둔 사전 계산 JSON을 가져온다. 실패 시 null 반환.
const GITHUB_PRECOMPUTED_JSON_URL = 'https://raw.githubusercontent.com/choigoda-kr/weather-report/main/data/weather-latest.json';
async function fetchPrecomputedWeatherJson() {
  const resp = await fetch(GITHUB_PRECOMPUTED_JSON_URL, { cache: 'no-store' });
  if (!resp.ok) return null;
  const data = await resp.json();
  if (!data || !data.payload || !data.generatedAt) return null;

  // 15분 이상 지난 스냅샷은 신뢰하지 않고 GAS 실시간 방식으로 폴백
  const ageMs = Date.now() - new Date(data.generatedAt).getTime();
  if (ageMs > 15 * 60 * 1000) return null;

  return data;
}

// 2. Fetch 및 Mapping 로직 구조화
async function fetchWeatherData(startDateStr, endDateStr, forceRefresh = false) {
  const CACHE_TTL = 5 * 60 * 1000; // 5분 TTL
  const cacheKey = `weather_data_v6_${startDateStr}_${endDateStr}`;
  let cached = null;
  try {
    cached = sessionStorage.getItem(cacheKey);
  } catch (e) {
    console.warn('SessionStorage unavailable, skipping cache', e);
  }

  const urlParamsForCache = new URLSearchParams(window.location.search);
  const isTestMode = urlParamsForCache.get('mode') === 'test_rain';

  if (!isTestMode && !forceRefresh && cached) {
    const data = JSON.parse(cached);
    if (Date.now() - data.timestamp < CACHE_TTL) {
      console.log('Using cached data for', startDateStr, 'to', endDateStr);
      updateLastTimeString(data.lastUpdated);
      document.getElementById('loading-indicator').classList.add('hidden');
      return data.payload;
    }
  }

  // 로딩 상태 시작
  document.getElementById('loading-indicator').classList.remove('hidden');

  try {
    const lats = locations.map(l => l.lat).join(',');
    const lons = locations.map(l => l.lon).join(',');
    const locNamesStr = locations.map(l => l.name).join(',');
    // 관측소 이름 매칭용 (옹진은 '백령도'로 매칭)
    const matchNamesStr = locations.map(l => l.name === '옹진' ? '백령도' : l.name).join(',');

    let results;
    let serverLastUpdated = null;
    let usedStaticSource = false;

    // 기본 조회기간(어제~오늘)이고 강제새로고침이 아닐 경우, GAS 왕복 대신
    // GitHub Actions가 미리 계산해 커밋해둔 정적 JSON을 우선 시도 (첫 화면 로딩 속도 개선)
    if (!isTestMode && !forceRefresh && isDefaultDateRange(startDateStr, endDateStr)) {
      try {
        const staticData = await fetchPrecomputedWeatherJson();
        if (staticData) {
          results = staticData.payload;
          serverLastUpdated = staticData.lastUpdated;
          usedStaticSource = true;
        }
      } catch (e) {
        console.warn('사전 계산 JSON 로드 실패, GAS 방식으로 폴백:', e);
      }
    }

    if (!usedStaticSource) {
      console.log('Fetching Hybrid Data via GAS Backend...');

      // 로컬/테스트 환경에서 google 객체가 없을 경우를 대비
      if (typeof google === 'undefined' || typeof google.script === 'undefined') {
          throw new Error("GAS 환경(google.script.run)을 찾을 수 없습니다.");
      }

      const responseObj = await new Promise((resolve, reject) => {
          google.script.run
              .withSuccessHandler((res) => {
                  try {
                      resolve(JSON.parse(res));
                  } catch(e) { reject(e); }
              })
              .withFailureHandler(reject)
              .getMergedWeatherData(lats, lons, locNamesStr, matchNamesStr, startDateStr, endDateStr);
      });

      if (responseObj && responseObj.payload) {
          results = responseObj.payload;
          serverLastUpdated = responseObj.lastUpdated;
      } else {
          results = responseObj;
          if (results && results.length > 0 && results[0].lastUpdated) {
              serverLastUpdated = results[0].lastUpdated;
          }
      }
    }

    updateLastTimeString(serverLastUpdated);

    // 기상청 특보 기준 판별 (단일 레벨 반환)
    function getAlertLevel(precips) {
        let level = 'none';
        for (let i = 0; i < precips.length; i++) {
            let sum3h = 0;
            for (let j = 0; j < 3 && i + j < precips.length; j++) sum3h += precips[i+j];
            let sum12h = 0;
            for (let j = 0; j < 12 && i + j < precips.length; j++) sum12h += precips[i+j];
            
            if (sum3h >= 90 || sum12h >= 180) return 'red';
            if (sum3h >= 60 || sum12h >= 110) level = 'orange';
        }
        return level;
    }

    // 시간별 배열 요소마다 특보 기준 판별 배열 반환 (Peak Hour 단일 표출 로직)
    function getAlertArray(precips) {
        const alerts = new Array(precips.length).fill('none');
        
        for (let i = 0; i < precips.length; i++) {
            // 3시간 누적 검사
            let sum3h = 0;
            let max3h = -1;
            let max3hIdx = i;
            for (let j = 0; j < 3 && i + j < precips.length; j++) {
                sum3h += precips[i+j];
                if (precips[i+j] > max3h) {
                    max3h = precips[i+j];
                    max3hIdx = i+j;
                }
            }
            
            // 12시간 누적 검사
            let sum12h = 0;
            let max12h = -1;
            let max12hIdx = i;
            for (let j = 0; j < 12 && i + j < precips.length; j++) {
                sum12h += precips[i+j];
                if (precips[i+j] > max12h) {
                    max12h = precips[i+j];
                    max12hIdx = i+j;
                }
            }
            
            // 임계값 초과 시, 해당 구간 내 '최대 강수량 시간'에만 뱃지 부여
            if (sum3h >= 90) alerts[max3hIdx] = 'red';
            else if (sum3h >= 60 && alerts[max3hIdx] !== 'red') alerts[max3hIdx] = 'orange';
            
            if (sum12h >= 180) alerts[max12hIdx] = 'red';
            else if (sum12h >= 110 && alerts[max12hIdx] !== 'red') alerts[max12hIdx] = 'orange';
        }
        return alerts;
    }

    // 데이터 정규화(Mapping) 처리
    const processedData = locations.map((loc, index) => {
        const data = results[index] || {};
        
        // 1. 기상 상태 및 실황 데이터 파싱
        const currentTemp = data.current?.temp !== undefined ? Number(data.current.temp).toFixed(1) : '-';
        // AWS에서 서버가 계산해준 과거 누적 강수량 사용 (없으면 0.0)
        const totalPrecip = data.historyTotal !== undefined ? Number(data.historyTotal).toFixed(1) : '0.0';
        
        // 진짜 실시간 날씨 코드(data.current.code) 우선 적용. (없으면 과거처럼 강수량 기반 임시 대체)
        const conditionCode = data.current?.code !== undefined ? data.current.code : ((parseFloat(totalPrecip) > 0) ? 61 : 0);
        const condition = getWeatherCondition(conditionCode); 

        // 2. 향후 24시간 강수량 (기상청 단기예보)
        let next24hSum = 0;
        const targetPrecips = [];
        const hourlyTimes = [];
        const hourlyPrecips = [];
        
        if (data.forecast24h) {
            // 현재 시간을 정각 기준으로 구함 (예: 10:22 -> 10:00)
            const now = new Date();
            const currentHourTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 0, 0, 0).getTime();
            
            // 24시간의 타임스탬프 배열 생성
            const targetTimes = [];
            for (let i = 0; i < 24; i++) {
                targetTimes.push(new Date(currentHourTime + i * 3600000));
            }
            
            if (data.forecast24h.precip_hourly) {
                // Open-Meteo 포맷인 경우 (외국 등)
                targetTimes.forEach(t => {
                    const dtStr = t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,'0') + "-" + String(t.getDate()).padStart(2,'0') + "T" + String(t.getHours()).padStart(2,'0') + ":00";
                    let pValue = 0;
                    const match = data.forecast24h.precip_hourly.find(p => {
                        const pDtStr = p.date.replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3") + "T" + p.time.substring(0,2) + ":00";
                        return pDtStr === dtStr;
                    });
                    if (match) {
                        pValue = parseFloat(match.value);
                        if (isNaN(pValue)) pValue = 0;
                    }
                    next24hSum += pValue;
                    targetPrecips.push(pValue);
                    hourlyTimes.push(dtStr);
                    hourlyPrecips.push(pValue);
                });
            } else {
                // KMA 단기예보(forecast24h) 전용 - Open-Meteo 참조 배제
                targetTimes.forEach(t => {
                    const y = t.getFullYear();
                    const m = String(t.getMonth()+1).padStart(2,'0');
                    const d = String(t.getDate()).padStart(2,'0');
                    const h = String(t.getHours()).padStart(2,'0');
                    
                    const dtStrIso = `${y}-${m}-${d}T${h}:00`;
                    const dtStrKmaOld = `${y}${m}${d}${h}00`;
                    const dtStrKmaNew = `${y}-${m}-${d}T${h}:00:00+09:00`;
                    
                    let pValue = 0;
                    // 기상청 데이터 매칭 (없으면 0 처리)
                    if (data.forecast24h[dtStrKmaNew] !== undefined) {
                        pValue = parseFloat(data.forecast24h[dtStrKmaNew]);
                    } else if (data.forecast24h[dtStrKmaOld] !== undefined) {
                        pValue = parseFloat(data.forecast24h[dtStrKmaOld]);
                    } else if (data.forecast24h[dtStrIso] !== undefined) {
                        pValue = parseFloat(data.forecast24h[dtStrIso]);
                    }
                    
                    if (isNaN(pValue)) pValue = 0;
                    next24hSum += pValue;
                    targetPrecips.push(pValue);
                    hourlyTimes.push(dtStrIso);
                    hourlyPrecips.push(pValue);
                });
            }
        }
        const next24hPrecip = next24hSum.toFixed(1);

        // 3. 향후 10일 강수량 (24시간 예측과 겹치지 않도록 필터링)
        const nowMs = Date.now();
        const last24hTimeMs = hourlyTimes.length > 0 ? new Date(hourlyTimes[hourlyTimes.length - 1]).getTime() : nowMs;

        const futureHourlyTimes = [];
        const futureHourlyPrecips = [];
        if (data.forecast10dHourly) {
            Object.keys(data.forecast10dHourly).sort().forEach(key => {
                const itemTimeMs = new Date(key).getTime();
                // 24시간 예측 이후의 데이터만 추가
                if (itemTimeMs > last24hTimeMs) {
                    futureHourlyTimes.push(key);
                    let pValue = parseFloat(data.forecast10dHourly[key]);
                    if (isNaN(pValue)) pValue = 0;
                    futureHourlyPrecips.push(pValue);
                }
            });
        }

        const rawFutureDates = data.forecast10d?.time || [];
        const futureDates = [];
        const futurePrecips = [];
        let next10dSum = 0;

        rawFutureDates.forEach((dateStr, idx) => {
            let dailySum = 0;
            let matchedHours = 0;
            
            for(let i = 0; i < futureHourlyTimes.length; i++) {
                if(futureHourlyTimes[i].startsWith(dateStr)) {
                    matchedHours++;
                    dailySum += futureHourlyPrecips[i];
                }
            }
            
            const dateMs = new Date(dateStr).getTime();
            const last24hDateStr = hourlyTimes.length > 0 ? hourlyTimes[hourlyTimes.length - 1].substring(0, 10) : "";
            const last24hDateMs = last24hDateStr ? new Date(last24hDateStr).getTime() : 0;

            // 시간별 데이터가 없고, 24시간 예측 범위 밖의 완전한 미래 날짜인 경우에만 폴백 사용
            if (matchedHours === 0 && dateMs > last24hDateMs) {
                dailySum = data.forecast10d?.precipitation_sum?.[idx] || 0;
            }
            
            // 24시간 예측 내에 완전히 포함되어 남은 시간별 데이터가 없는 날짜는 모달 목록에서 아예 제외(스킵)
            if (matchedHours === 0 && dateMs <= last24hDateMs) {
                return; 
            }
            
            futureDates.push(dateStr);
            futurePrecips.push(dailySum);
            next10dSum += dailySum;
        });

        const next10dPrecip = next10dSum.toFixed(1);

        // 4. Sliding Window 경보 레벨 판별 (1시간 50mm, 3시간 90mm 등 -> 기상청 3시간/12시간 기준으로 변경)
        const max24hAlert = getAlertLevel(hourlyPrecips);
        const max10dAlert = getAlertLevel(futureHourlyPrecips);
        let alertLevel = 'none';
        if (max24hAlert === 'red' || max10dAlert === 'red') alertLevel = 'red';
        else if (max24hAlert === 'orange' || max10dAlert === 'orange') alertLevel = 'orange';

        return {
            ...loc,
            condition,
            currentTemp,
            totalPrecip,
            next24hPrecip,
            next10dPrecip,
            alertLevel,
            max24hAlert,
            max10dAlert,
            dailyDates: data.dailyDates || [],
            dailyPrecips: data.dailyPrecips || [],
            futureDates: futureDates,
            futurePrecips: futurePrecips,
            futureHourlyTimes: futureHourlyTimes,
            futureHourlyPrecips: futureHourlyPrecips,
            futureHourlyAlerts: getAlertArray(futureHourlyPrecips),
            hourlyTimes: hourlyTimes,
            hourlyPrecips: hourlyPrecips,
            hourlyAlerts: getAlertArray(hourlyPrecips),
            historyHourlyTimes: data.historyHourlyTimes || [],
            historyHourlyPrecips: data.historyHourlyPrecips || [],
            alertStatus: data.alertStatus || '없음',
            tmEf: data.tmEf || ''
        };
    });

    // SessionStorage 캐싱 저장
    try {
      sessionStorage.setItem(cacheKey, JSON.stringify({
        timestamp: Date.now(),
        payload: processedData,
        lastUpdated: serverLastUpdated
      }));
    } catch (e) {
      console.warn('SessionStorage setItem failed', e);
    }

    // [정식 기능] URL 파라미터 ?mode=test_rain 기상 경보 시스템 테스트 모드
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'test_rain' && processedData && processedData.length >= 2) {
      console.log('[Mock Mode] ?mode=test_rain 호우 경보 시스템 가상 테스트 가동');
      
      // 1. 인천 (index 0) -> 주의보(orange) 주입
      processedData[0].alertLevel = 'orange';
      
      // 2. 여주 (index 1) -> 경보(red) 주입 및 1시간 강수량 55.5mm 임시 추가하여 긴급 모달 트리거
      processedData[1].alertLevel = 'red';
      
      const futureHour = new Date(Date.now() + 2 * 60 * 60 * 1000);
      const offset = futureHour.getTimezoneOffset() * 60000;
      const futureLocalStr = new Date(futureHour - offset).toISOString().substring(0, 16);
      
      processedData[1].hourlyTimes.push(futureLocalStr);
      processedData[1].hourlyPrecips.push(55.5);
    }

    document.getElementById('loading-indicator').classList.add('hidden');
    updateLastTimeString();

    return processedData;
    
  } catch (error) {
    console.error('[GAS Fetch Exception]', error);
    document.getElementById('loading-indicator').classList.add('hidden');
    window.showToast('데이터 로드 실패 (GAS 환경 확인 요망)', true);
    return null;
  }
}

function updateLastTimeString(serverString) {
  let timeStr = '';
  if (serverString) {
    timeStr = `최종 갱신: ${serverString}`;
  } else {
    const now = new Date();
    timeStr = `최종 갱신: ${now.toLocaleTimeString('ko-KR')}`;
  }
  
  // 1. 메인 화면 갱신

function findEmergencyPeriods(times, precips, nowMs) {
    const n = times.length;
    const allWindows = [];
    
    for (let i = 0; i < n; i++) {
        // 3시간 누적 검사
        let sum3 = 0;
        let endIdx3 = Math.min(i + 2, n - 1);
        for(let j = i; j <= endIdx3; j++) sum3 += precips[j];
        if (sum3 >= 60) {
            allWindows.push({ startIdx: i, endIdx: endIdx3, sum: sum3, type: sum3 >= 90 ? '경보' : '주의' });
        }
        
        // 12시간 누적 검사
        let sum12 = 0;
        let endIdx12 = Math.min(i + 11, n - 1);
        for(let j = i; j <= endIdx12; j++) sum12 += precips[j];
        if (sum12 >= 110) {
            allWindows.push({ startIdx: i, endIdx: endIdx12, sum: sum12, type: sum12 >= 180 ? '경보' : '주의' });
        }
    }
    
    // 우선순위 정렬 (경보 우선, 그 다음 누적 강수량 높은 순)
    allWindows.sort((a, b) => {
        if (a.type !== b.type) return a.type === '경보' ? -1 : 1;
        return b.sum - a.sum;
    });
    
    // 겹치지 않는 윈도우 선택
    const selected = [];
    for (const w of allWindows) {
        let overlap = false;
        for (const s of selected) {
            if (w.startIdx <= s.endIdx && w.endIdx >= s.startIdx) {
                overlap = true;
                break;
            }
        }
        if (!overlap) selected.push(w);
    }
    
    // UI 표출을 위한 포맷팅
    const results = [];
    for (const s of selected) {
        const startTimeStr = times[s.startIdx];
        const endTimeStr = times[s.endIdx];
        
        const endMs = new Date(endTimeStr).getTime();
        if (endMs < nowMs) continue; // 완전히 과거인 기간은 제외
        
        const startD = startTimeStr.split('T')[0];
        const endD = endTimeStr.split('T')[0];
        const dateDisplay = (startD !== endD) ? `${startD}~${endD.substring(5)}` : startD;
        
        const startT = startTimeStr.split('T')[1].substring(0, 5);
        const endT = endTimeStr.split('T')[1].substring(0, 5);
        const timeDisplay = `${startT}~${endT}`;
        
        results.push({
            dateDisplay: dateDisplay,
            timeDisplay: timeDisplay,
            precip: s.sum,
            type: s.type,
            sortTime: new Date(startTimeStr).getTime()
        });
    }
    return results;
}

function checkEmergencyRain(dataArray) {
  const emergencyLogs = [];
  const affectedLocations = new Set();
  const now = Date.now();
  
  dataArray.forEach(loc => {
    if (!loc.hourlyTimes || !loc.hourlyPrecips) return;
    
    const periods = findEmergencyPeriods(loc.hourlyTimes, loc.hourlyPrecips, now);
    
    periods.forEach(p => {
        affectedLocations.add(loc.name);
        emergencyLogs.push({
            name: loc.name,
            date: p.dateDisplay,
            time: p.timeDisplay,
            precip: p.precip,
            type: p.type,
            sortTime: p.sortTime
        });
    });
  });
  
  if (emergencyLogs.length > 0) {
    // 서명(Signature) 생성: 지역명:타입 기준으로 정렬
    const signature = emergencyLogs.map(l => `${l.name}:${l.type}`).sort().join(',');
    
    // 로컬 스토리지 확인
    const hideDate = localStorage.getItem('hideEmergencyDate');
    const hideSignature = localStorage.getItem('hideEmergencySignature');
    const todayStr = new Date().toDateString();
    
    if (hideDate === todayStr && hideSignature === signature) {
      return; // 오늘 이미 확인했고, 상황(지역/위험수준)도 변하지 않았으므로 팝업 생략
    }

    const locsArray = Array.from(affectedLocations).join(', ');
    document.getElementById('emergency-modal-title').innerHTML = `<i class="fa-solid fa-triangle-exclamation"><\/i> 긴급: ${locsArray}에 강한 호우 예상됨`;
    
    const tbody = document.getElementById('emergency-modal-tbody');
    tbody.innerHTML = '';
    
    // 시간순 정렬
    emergencyLogs.sort((a, b) => a.sortTime - b.sortTime);
    
    emergencyLogs.forEach(log => {
      const badgeClass = log.type === '경보' ? 'bg-red-100 text-red-700 border-red-200' : 'bg-orange-100 text-orange-700 border-orange-200';
      tbody.innerHTML += `
        <tr class="hover:bg-slate-50 transition-colors">
          <td class="px-4 py-3 font-bold text-slate-800">${log.name} <span class="ml-1 text-[10px] px-1.5 py-0.5 rounded border ${badgeClass}">${log.type}</span></td>
          <td class="px-4 py-3 text-slate-600">${log.date}</td>
          <td class="px-4 py-3 text-slate-600">${log.time}</td>
          <td class="px-4 py-3 text-right font-mono font-bold text-red-600">${Number(log.precip).toFixed(1)} <span class="text-xs text-slate-400 font-normal">mm</span></td>
        </tr>
      `;
    });
    
    const modal = document.getElementById('emergency-modal');
    
    // 체크박스 초기화
    const cb = document.getElementById('emergency-hide-today');
    if (cb) cb.checked = false;
    
    modal.showModal();
    
    // 30초 카운트다운 자동 닫힘 로직 추가
    let timeLeft = 10;
    const timerSpan = document.getElementById('emergency-modal-timer');
    
    if (window._emergencyTimer) clearInterval(window._emergencyTimer);
    if (timerSpan) timerSpan.textContent = `(${timeLeft}s)`;
    
    window._emergencyTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
            if (timerSpan) timerSpan.textContent = `(${timeLeft}s)`;
        } else {
            clearInterval(window._emergencyTimer);
            if (modal.open) modal.close();
        }
    }, 1000);
    
    modal.addEventListener('close', () => {
        if (window._emergencyTimer) clearInterval(window._emergencyTimer);
        
        const cb = document.getElementById('emergency-hide-today');
        if (cb && cb.checked) {
            localStorage.setItem('hideEmergencyDate', new Date().toDateString());
            localStorage.setItem('hideEmergencySignature', signature);
        }
    }, { once: true });
  }
}
