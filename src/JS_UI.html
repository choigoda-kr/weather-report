<script>
function initSkeleton() {
  const grid = document.getElementById('weather-grid');
  grid.innerHTML = '';
  // 15개의 스켈레톤 UI 생성
  for(let i=0; i<15; i++) {
    grid.innerHTML += `
      <div class="weather-card skeleton-card rounded-2xl p-4 sm:p-5 flex flex-col justify-between h-auto min-h-[12.5rem] bg-white md:bg-slate-800/50 border border-[#EEEEEE] md:border-slate-700/30 shadow-[0_2px_10px_rgba(0,0,0,0.03)] md:shadow-none">
        <div class="flex justify-between">
          <div class="h-6 bg-slate-200 md:bg-slate-700/80 rounded w-16 mb-4"><\/div>
          <div class="h-10 w-10 bg-slate-200 md:bg-slate-700/80 rounded-full"><\/div>
        <\/div>
        <div class="space-y-3 mt-auto">
           <div class="h-14 bg-slate-100 md:bg-slate-700/60 rounded-lg w-full"><\/div>
           <div class="h-14 bg-slate-100 md:bg-slate-700/60 rounded-lg w-full"><\/div>
           <div class="h-14 bg-slate-100 md:bg-slate-700/60 rounded-lg w-full"><\/div>
        <\/div>
      <\/div>
    `;
  }
}

// 4. 모달 관련 전역 함수
window.toggleHourlyData = function(dateIndex) {
  const el = document.getElementById(`hourly-row-${dateIndex}`);
  if(el.classList.contains('hidden')) {
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
};

function generateHourlyChart(dateStr, hourlyTimes, hourlyPrecips, colorTheme, hourlyAlerts) {
  const barColor = colorTheme === 'future' ? 'bg-amber-400' : 'bg-blue-400';
  const textColor = colorTheme === 'future' ? 'text-amber-400' : 'text-blue-400';
  
  const now = new Date();
  const hoursData = [];
  let maxPrecip = -1;
  let maxIdx = -1;
  
  for(let i=0; i<hourlyTimes.length; i++) {
    if(hourlyTimes[i].startsWith(dateStr)) {
      const itemTime = new Date(hourlyTimes[i]);
      
      // 과거 강수내역 모달(history)의 경우: 오늘 날짜라면 현재 시각 이전까지만 표출
      if (colorTheme === 'history' && itemTime > now) {
        continue;
      }
      // 향후 10일 예상 모달(future)의 경우: 오늘 날짜라면 현재 시각 이후만 표출
      if (colorTheme === 'future' && itemTime <= now) {
        continue;
      }
      
      const val = hourlyPrecips[i] || 0;
      const alertType = (hourlyAlerts && hourlyAlerts[i]) ? hourlyAlerts[i] : 'none';
      hoursData.push({ time: hourlyTimes[i], val, alertType });
      if(val > maxPrecip) { maxPrecip = val; maxIdx = hoursData.length - 1; }
    }
  }
  
  if(hoursData.length === 0) {
    return `<div class="text-center text-xs text-slate-400 py-2">시간별 데이터가 없습니다.<\/div>`;
  }
  
  let chartHtml = `<div class="flex overflow-x-auto gap-2 pb-2 pt-1 custom-scrollbar-hide snap-x">`;
  hoursData.forEach((d, idx) => {
    const isMax = (idx === maxIdx && maxPrecip > 0);
    const hColor = isMax ? 'bg-red-500' : barColor;
    const tColor = isMax ? 'text-red-500 font-bold' : 'text-slate-400 md:text-slate-500';
    const valColor = isMax ? 'text-red-500 font-bold' : 'text-slate-600 md:text-slate-400';
    
    let hPx = 2;
    if(maxPrecip > 0 && d.val > 0) {
      hPx = Math.max(2, Math.floor((d.val / maxPrecip) * 36)); 
    }
    
    const hourStr = d.time.substring(11, 16); 
    const valStr = d.val > 0 ? d.val.toFixed(1) : '0';
    
    let badgeHtml = '';
    if (d.alertType === 'red') badgeHtml = `<div class="text-[9px] bg-red-500 text-white px-1 rounded mb-0.5 whitespace-nowrap shadow-sm animate-pulse">경보</div>`;
    else if (d.alertType === 'orange') badgeHtml = `<div class="text-[9px] bg-orange-500 text-white px-1 rounded mb-0.5 whitespace-nowrap shadow-sm">주의</div>`;

    chartHtml += `
      <div class="flex flex-col items-center justify-end min-w-[36px] snap-center">
        ${badgeHtml}
        <span class="text-[10px] mb-1 ${valColor}">${valStr}<\/span>
        <div class="w-4 rounded-t-sm ${hColor}" style="height: ${hPx}px; transition: height 0.3s ease;"><\/div>
        <span class="text-[9px] mt-1 ${tColor}">${hourStr}<\/span>
      <\/div>
    `;
  });
  chartHtml += `<\/div>`;
  
  if(maxPrecip > 0) {
    const peakTime = hoursData[maxIdx].time.substring(11, 16);
    chartHtml = `<div class="text-[11px] mb-2 text-red-500 font-bold tracking-tight"><i class="fa-solid fa-triangle-exclamation"><\/i> ${peakTime} 피크 집중 강수 (${maxPrecip.toFixed(1)}mm)<\/div>` + chartHtml;
  }
  return chartHtml;
}

const holidays2026 = [
  '2026-01-01', '2026-02-16', '2026-02-17', '2026-02-18', '2026-03-01', '2026-03-02',
  '2026-05-05', '2026-05-24', '2026-05-25', '2026-06-06', '2026-08-15', '2026-09-24',
  '2026-09-25', '2026-09-26', '2026-09-28', '2026-10-03', '2026-10-09', '2026-12-25'
];

function getDayAndColor(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return { text: dateStr, colorClass: 'text-[#1D1D1F] md:text-slate-300' };
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  let colorClass = 'text-[#1D1D1F] md:text-slate-300';
  if (d.getDay() === 0 || holidays2026.includes(dateStr)) {
    colorClass = 'text-red-500 font-bold';
  } else if (d.getDay() === 6) {
    colorClass = 'text-blue-500 font-bold';
  }
  return { text: `${dateStr} (${days[d.getDay()]})`, colorClass };
}

window.showHistoryModal = function(name, dates, precips, hourlyTimes, hourlyPrecips, total) {
  document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-clock-rotate-left text-blue-500 md:text-blue-400"><\/i> ${name} 과거 강수내역`;
  document.getElementById('modal-total').innerText = total;
  document.getElementById('modal-data-source').innerHTML = `<i class="fa-solid fa-circle-info"><\/i> 기상청`;
  
  const tbody = document.getElementById('modal-tbody');
  tbody.innerHTML = '';
  dates.forEach((date, i) => {
    const val = precips[i] !== null ? Number(precips[i]).toFixed(1) : '0.0';
    const dateInfo = getDayAndColor(date);
    tbody.innerHTML += `
      <tr class="hover:bg-slate-100 md:hover:bg-slate-700/30 transition-colors cursor-pointer group" onclick="toggleHourlyData('hist-${i}')">
        <td class="px-4 py-3 sm:py-2.5 flex items-center gap-2">
          <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-blue-500 transition-colors"><\/i> 
          <span class="${dateInfo.colorClass}">${dateInfo.text}<\/span>
        <\/td>
        <td class="px-4 py-3 sm:py-2.5 text-right font-mono ${Number(val) > 0 ? 'text-[#003366] md:text-blue-400 font-bold' : 'text-slate-400 md:text-slate-500'}">${val}<\/td>
      <\/tr>
      <tr id="hourly-row-hist-${i}" class="hidden bg-[#F8F8F8] md:bg-slate-900/50">
        <td colspan="2" class="px-4 py-3 border-t border-[#E5E5E5] md:border-slate-700/50">
          ${generateHourlyChart(date, hourlyTimes, hourlyPrecips, 'history')}
        <\/td>
      <\/tr>
    `;
  });
  document.getElementById('detail-modal').showModal();
};

window.showNext24hModal = function(name, hourlyTimes, hourlyPrecips, hourlyAlerts) {
  document.getElementById('modal-title').innerHTML = `<i class="fa-regular fa-clock text-blue-500 md:text-sky-400"><\/i> ${name} 향후 24시간 예측`;
  document.getElementById('modal-data-source').innerHTML = `<i class="fa-solid fa-circle-info"><\/i> 기상청`;
  const tbody = document.getElementById('modal-tbody');
  tbody.innerHTML = '';
  
  let sum = 0;
  const nowMs = Date.now();
  const next24hMs = nowMs + (24 * 60 * 60 * 1000);
  
  let hasData = false;
  
  if (hourlyTimes && hourlyTimes.length > 0) {
    hourlyTimes.forEach((t, i) => {
      const timeMs = new Date(t).getTime();
      if (timeMs >= nowMs && timeMs <= next24hMs) {
        hasData = true;
        const val = hourlyPrecips[i] !== null && hourlyPrecips[i] !== undefined ? Number(hourlyPrecips[i]) : 0;
        sum += val;
        const valStr = val.toFixed(1);
        
        // Extract hour string, e.g. "2023-01-01T15:00" -> "15:00"
        const hourStr = t.substring(11, 16);
        const dateStr = t.substring(5, 10).replace('-', '/'); // "01/01"
        
        let badgeHtml = '';
        const alertType = (hourlyAlerts && hourlyAlerts[i]) ? hourlyAlerts[i] : 'none';
        if (alertType === 'red') badgeHtml = `<span class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-sm shadow-sm ml-2 animate-pulse">경보<\/span>`;
        else if (alertType === 'orange') badgeHtml = `<span class="bg-orange-500 text-white text-[10px] px-1.5 py-0.5 rounded-sm shadow-sm ml-2">주의<\/span>`;
        
        tbody.innerHTML += `
          <tr class="hover:bg-slate-100 md:hover:bg-slate-700/30 transition-colors">
            <td class="px-4 py-3 sm:py-2.5 text-[#1D1D1F] md:text-slate-300 font-mono flex items-center">
              <span class="text-xs text-slate-400 mr-2">${dateStr}<\/span>${hourStr}${badgeHtml}
            <\/td>
            <td class="px-4 py-3 sm:py-2.5 text-right font-mono ${val > 0 ? 'text-[#003366] md:text-sky-400 font-bold' : 'text-slate-400 md:text-slate-500'}">${valStr}<\/td>
          <\/tr>
        `;
      }
    });
  }
  
  if (!hasData) {
    tbody.innerHTML = '<tr><td colspan="2" class="text-center py-6 text-slate-400 text-sm">데이터가 없습니다.<\/td><\/tr>';
  }
  
  document.getElementById('modal-total').innerText = sum.toFixed(1);
  document.getElementById('detail-modal').showModal();
};

window.showFutureModal = function(name, dates, precips, hourlyTimes, hourlyPrecips, hourlyAlerts) {
  document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-fast-forward text-blue-500 md:text-amber-400"><\/i> ${name} 향후 10일 강수예측`;
  document.getElementById('modal-data-source').innerHTML = `<i class="fa-solid fa-circle-info"><\/i> Open-Meteo`;
  const tbody = document.getElementById('modal-tbody');
  tbody.innerHTML = '';
  
  let sum = 0;
  
  if (!dates || dates.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" class="text-center py-6 text-slate-400 text-sm">데이터가 없습니다.<\/td><\/tr>';
    document.getElementById('modal-total').innerText = '0.0';
    document.getElementById('detail-modal').showModal();
    return;
  }
  
  dates.forEach((date, i) => {
    const val = precips[i] !== null ? Number(precips[i]) : 0;
    sum += val;
    const valStr = val.toFixed(1);
    const dateInfo = getDayAndColor(date);
    
    // 해당 날짜의 시간별 최고 알림 레벨 계산
    let maxAlert = 'none';
    if (hourlyTimes && hourlyAlerts) {
      for (let j = 0; j < hourlyTimes.length; j++) {
        if (hourlyTimes[j].startsWith(date)) {
          if (hourlyAlerts[j] === 'red') maxAlert = 'red';
          else if (hourlyAlerts[j] === 'orange' && maxAlert !== 'red') maxAlert = 'orange';
        }
      }
    }
    
    let badgeHtml = '';
    if (maxAlert === 'red') {
      badgeHtml = `<span class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-sm shadow-sm ml-2 animate-pulse">경보</span>`;
    } else if (maxAlert === 'orange') {
      badgeHtml = `<span class="bg-orange-500 text-white text-[10px] px-1.5 py-0.5 rounded-sm shadow-sm ml-2">주의</span>`;
    }

    tbody.innerHTML += `
      <tr class="hover:bg-slate-100 md:hover:bg-slate-700/30 transition-colors cursor-pointer group" onclick="toggleHourlyData('fut-${i}')">
        <td class="px-4 py-3 sm:py-2.5 flex items-center gap-2">
          <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 group-hover:text-amber-400 transition-colors"><\/i> 
          <span class="${dateInfo.colorClass}">${dateInfo.text}<\/span>${badgeHtml}
        <\/td>
        <td class="px-4 py-3 sm:py-2.5 text-right font-mono ${val > 0 ? 'text-[#003366] md:text-amber-400 font-bold' : 'text-slate-400 md:text-slate-500'}">${valStr}<\/td>
      <\/tr>
      <tr id="hourly-row-fut-${i}" class="hidden bg-[#F8F8F8] md:bg-slate-900/50">
        <td colspan="2" class="px-4 py-3 border-t border-[#E5E5E5] md:border-slate-700/50">
          ${generateHourlyChart(date, hourlyTimes, hourlyPrecips, 'future', hourlyAlerts)}
        <\/td>
      <\/tr>
    `;
  });
  
  document.getElementById('modal-total').innerText = sum.toFixed(1);
  document.getElementById('detail-modal').showModal();
};

// 4. Flatpickr 초기화 및 로직
let isUserCustomDate = false;

function initApp() {
  initSkeleton(); // 최초 로딩 시 스켈레톤 배치
  
  const today = new Date();
  const resetBtn = document.getElementById('btn-auto-refresh-reset');
  
  // 기본값: 오늘 기준 최근 2일 (당일 기준 D-1)
  const defaultStartDate = new Date(today);
  defaultStartDate.setDate(defaultStartDate.getDate() - 1);
  
  // 최대 15일 이내 제한 설정 (구글 시트 과거 데이터 보존 기준)
  const maxLimitDate = new Date(today);
  maxLimitDate.setDate(maxLimitDate.getDate() - 15);
  
  const format = d => {
     // 로컬 타임존 기준으로 yyyy-mm-dd 추출
     const offset = d.getTimezoneOffset() * 60000;
     const localISOTime = (new Date(d - offset)).toISOString().split('T')[0];
     return localISOTime;
  };
  
  let currentStart = format(defaultStartDate);
  let currentEnd = format(today);

  flatpickr('#date-range', {
    mode: 'range',
    locale: 'ko', // 한국어 로케일 지정 (index.html에 cdn 추가됨)
    defaultDate: [currentStart, currentEnd],
    minDate: maxLimitDate,
    maxDate: today,
    dateFormat: "Y-m-d",
    onChange: function(selectedDates, dateStr, instance) {
      if (selectedDates.length === 1) {
        // 시작일이 선택되면, 최대 15일 범위 내로 선택 가능하도록 잠금 설정
        const start = selectedDates[0];
        const maxLimit = new Date(start);
        maxLimit.setDate(maxLimit.getDate() + 14);
        const minLimit = new Date(start);
        minLimit.setDate(minLimit.getDate() - 14);

        instance.set('maxDate', maxLimit < today ? maxLimit : today);
        instance.set('minDate', minLimit > maxLimitDate ? minLimit : maxLimitDate);
      } else {
        // 선택이 완료되거나 취소되면 다시 기본 15일 제한으로 복구
        instance.set('maxDate', today);
        instance.set('minDate', maxLimitDate);
      }
    }
  });

  const searchBtn = document.getElementById('btn-search-date');
  if (searchBtn) {
    searchBtn.addEventListener('click', async () => {
      const fp = document.querySelector('#date-range')?._flatpickr;
      if (fp && fp.selectedDates.length === 2) {
        const sDate = fp.selectedDates[0];
        const eDate = fp.selectedDates[1];
        const diffDays = Math.ceil(Math.abs(eDate - sDate) / (1000 * 60 * 60 * 24));
        
        if (diffDays > 14) {
          if (window.showToast) window.showToast("조회 기간은 최대 15일 이내로 선택해주세요.", true);
          return;
        }

        isUserCustomDate = true;
        if (resetBtn) resetBtn.classList.remove('hidden');
        
        document.getElementById('loading-indicator').classList.remove('hidden');
        const s = format(fp.selectedDates[0]);
        const e = format(fp.selectedDates[1]);
        const d = await fetchWeatherData(s, e);
        if (d) renderCards(d, window.getPeriodText(s, e));
      } else {
        if(window.showToast) window.showToast("조회할 기간(시작일과 종료일)을 모두 선택해주세요.", true);
      }
    });
  }

  const dataSourceBtn = document.getElementById('btn-data-source');
  const dataSourceModal = document.getElementById('data-source-modal');
  const dataSourceCloseBtn = document.getElementById('data-source-modal-close-btn');

  if (dataSourceBtn && dataSourceModal) {
    dataSourceBtn.addEventListener('click', () => {
      dataSourceModal.showModal();
    });
  }
  if (dataSourceCloseBtn && dataSourceModal) {
    dataSourceCloseBtn.addEventListener('click', () => {
      dataSourceModal.close();
    });
  }

  const refSitesBtn = document.getElementById('btn-reference-sites');
  const refSitesModal = document.getElementById('reference-sites-modal');
  const refSitesCloseBtn = document.getElementById('reference-sites-modal-close-btn');

  if (refSitesBtn && refSitesModal) {
    refSitesBtn.addEventListener('click', () => {
      refSitesModal.showModal();
    });
  }
  if (refSitesCloseBtn && refSitesModal) {
    refSitesCloseBtn.addEventListener('click', () => {
      refSitesModal.close();
    });
  }
  
  // 모달 바깥 배경 클릭 시 닫기
  if (refSitesModal) {
    refSitesModal.addEventListener('click', (e) => {
      if (e.target === refSitesModal) {
        refSitesModal.close();
      }
    });
  }

  const mapViewBtn = document.getElementById('btn-map-view');
  if (mapViewBtn) {
    mapViewBtn.addEventListener('click', () => {
      // 기본 중심: 경기지역본부 (수원 근방)
      window.showMapModal('경기도 중심', 37.2636, 127.0286);
    });
  }

  if (resetBtn) {
    resetBtn.addEventListener('click', async () => {
      isUserCustomDate = false;
      resetBtn.classList.add('hidden');
      
      const nowToday = new Date();
      const dynamicStartDate = new Date(nowToday);
      dynamicStartDate.setDate(dynamicStartDate.getDate() - 2);
      
      const s = format(dynamicStartDate);
      const e = format(nowToday);
      
      const fp = document.querySelector('#date-range')?._flatpickr;
      if (fp) fp.setDate([s, e], false);
      
      document.getElementById('loading-indicator').classList.remove('hidden');
      const d = await fetchWeatherData(s, e, true);
      if (d) renderCards(d, window.getPeriodText(s, e));
    });
  }

  // 최초 로딩 시 API Call
  fetchWeatherData(currentStart, currentEnd).then(d => { if(d) renderCards(d, window.getPeriodText(currentStart, currentEnd)); });

  // 자동 갱신 (테스트를 위해 5초 단위로 설정 - 추후 30분으로 원복)
  setInterval(async () => {
    console.log('[Auto-Refresh] Fetching latest weather data...');
    const fp = document.querySelector('#date-range')?._flatpickr;
    let s, e;
    
    if (isUserCustomDate && fp && fp.selectedDates.length === 2) {
      s = format(fp.selectedDates[0]);
      e = format(fp.selectedDates[1]);
    } else {
      const nowToday = new Date();
      const dynamicStartDate = new Date(nowToday);
      dynamicStartDate.setDate(dynamicStartDate.getDate() - 1);
      
      s = format(dynamicStartDate);
      e = format(nowToday);
      
      if (fp) fp.setDate([s, e], false);
    }
    
    document.getElementById('loading-indicator').classList.remove('hidden');
    const d = await fetchWeatherData(s, e, true);
    if (d) renderCards(d, window.getPeriodText(s, e));

    // 지도가 열려있을 경우 지도 안의 데이터도 자동 갱신
    const mapModal = document.getElementById('map-modal');
    if (mapModal && mapModal.open) {
      console.log('[Auto-Refresh] Updating map data...');
      let currentCenter = [37.2636, 127.0286];
      if (window._leafletMap) {
         currentCenter = [window._leafletMap.getCenter().lat, window._leafletMap.getCenter().lng];
      }
      window.showMapModal('업데이트 됨', currentCenter[0], currentCenter[1]);
    }
  }, 30 * 60 * 1000); // 30분(1800000ms)
}

// 비동기 스크립트 로드 시 DOMContentLoaded가 이미 발생했을 수 있으므로 상태 확인 후 실행
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

// ==========================================================
// 서브지역(읍면동) 데이터 캐시에서 가져오기 및 모달 렌더링
// ==========================================================
window.openSubRegionModal = function(cityName) {
  const modal = document.getElementById('sub-region-modal');
  if(!modal) return;
  document.getElementById('sub-region-modal-title').innerHTML = `<i class="fa-solid fa-map-location-dot text-blue-500"></i> ${cityName} 상세 기상데이터`;
  
  const loadingEl = document.getElementById('sub-region-loading');
  const gridEl = document.getElementById('sub-region-grid');
  
  gridEl.innerHTML = '';
  loadingEl.classList.remove('hidden');
  modal.showModal();
  
  const fp = document.querySelector('#date-range')?._flatpickr;
  const today = new Date();
  const format = d => {
     const offset = d.getTimezoneOffset() * 60000;
     return (new Date(d - offset)).toISOString().split('T')[0];
  };
  
  let s = format(new Date(today.getTime() - 1 * 24 * 60 * 60 * 1000));
  let e = format(today);
  
  if (fp && fp.selectedDates.length === 2) {
    s = format(fp.selectedDates[0]);
    e = format(fp.selectedDates[1]);
  }
  
  google.script.run
    .withSuccessHandler(function(responseStr) {
      loadingEl.classList.add('hidden');
      try {
        const data = JSON.parse(responseStr);
        if (!data || data.length === 0) {
          gridEl.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10">${cityName}은(는) 관측소가 1개 뿐이므로, 읍면동 데이터가 없습니다.</div>`;
          return;
        }
        
        if (data.length === 1 && data[0].error) {
          gridEl.innerHTML = `<div class="col-span-full text-center text-red-500 py-10">오류 발생: ${data[0].message}</div>`;
          return;
        }
        
        data.forEach(d => {
          gridEl.innerHTML += `
            <div class="bg-white md:bg-slate-800 rounded-xl p-4 shadow border border-[#E5E5E5] md:border-slate-700">
              <h4 class="text-lg font-bold text-[#1D1D1F] md:text-slate-200 mb-3 border-b border-[#F0F0F0] md:border-slate-700 pb-2">${d.name}</h4>
              <div class="space-y-2">
                <div class="flex justify-between items-center text-sm">
                  <span class="text-slate-500">${window.getPeriodText(s, e)} 강수량</span>
                  <span class="font-bold text-[#003366] md:text-blue-400">${d.totalPrecip} <span class="text-xs font-normal text-slate-400">mm</span></span>
                </div>
                <div class="flex justify-between items-center text-sm">
                  <span class="text-slate-500">향후 24시간 예상</span>
                  <span class="font-bold text-[#003366] md:text-sky-400">${d.next24hPrecip} <span class="text-xs font-normal text-slate-400">mm</span></span>
                </div>
                <div class="flex justify-between items-center text-sm">
                  <span class="text-slate-500">향후 10일 예상</span>
                  <span class="font-bold text-[#003366] md:text-amber-400">${d.next10dPrecip} <span class="text-xs font-normal text-slate-400">mm</span></span>
                </div>
              </div>
            </div>
          `;
        });
      } catch (err) {
        gridEl.innerHTML = `<div class="col-span-full text-center text-slate-500 py-10">데이터 파싱 중 오류가 발생했습니다.</div>`;
      }
    })
    .withFailureHandler(function(err) {
      loadingEl.classList.add('hidden');
      gridEl.innerHTML = `<div class="col-span-full text-center text-red-500 py-10">서버 통신 실패: ${err.message}</div>`;
    })
    .getSubRegionDataFromCache(cityName, s, e);
};

// ==========================================================
// 5. 지도 모달 제어 함수 (Leaflet.js 연동)
// ==========================================================

/** 지도 모달 닫기 */
window.closeMapModal = function() {
  const modal = document.getElementById('map-modal');
  modal.close();
  // 닫기 후 인스턴스 정리 (메모리 누수 방지)
  if (window._leafletMap) {
    try { window._leafletMap.remove(); } catch(e) { /* ignore */ }
    window._leafletMap = null;
  }
};

/**
 * 지도 모달 열기 (91개 전 지점 강수량 데이터 마커 표시)
 * @param {string} name  - 중심점(클릭한 지점)명
 * @param {number} lat   - 중심점 위도
 * @param {number} lon   - 중심점 경도
 */
window.showMapModal = function(name, lat, lon) {
  // 1. 좌표 유효성 검사
  if (lat == null || lon == null || isNaN(Number(lat)) || isNaN(Number(lon))) {
    alert(`[불러오기 실패] ${name} 지점의 위치 좌표가 없어 지도를 표시할 수 없습니다.`);
    return;
  }

  // 2. 모달 타이틀 갱신
  document.getElementById('map-modal-title-text').textContent = `경기도 기상청 관측소 현황`;
  document.getElementById('map-modal-info').textContent = document.getElementById('last-updated').innerText;

  // 3. 지도 모달 열기
  document.getElementById('map-modal').showModal();

  // 4. 기존 인스턴스 제거 및 시점 기억
  let currentZoom = 9;
  let currentCenter = [lat, lon];
  if (window._leafletMap) {
    currentZoom = window._leafletMap.getZoom();
    currentCenter = [window._leafletMap.getCenter().lat, window._leafletMap.getCenter().lng];
    try { window._leafletMap.remove(); } catch(e) { /* ignore */ }
    window._leafletMap = null;
  }

  // 5. 로딩 스피너 표시
  const mapEl = document.getElementById('map-container');
  mapEl.innerHTML = `
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; color:#94a3b8;">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem; color:#059669;"></i>
      <p style="font-size:12px; font-weight:500;">전 지점 기상 데이터를 불러오는 중...</p>
    </div>
  `;

  // 날짜 계산 (선택 기간 강수량 필터용)
  const fp = document.querySelector('#date-range')?._flatpickr;
  const today = new Date();
  const format = d => {
     const offset = d.getTimezoneOffset() * 60000;
     return (new Date(d - offset)).toISOString().split('T')[0];
  };
  
  let s = format(new Date(today.getTime() - 1 * 24 * 60 * 60 * 1000));
  let e = format(today);
  
  if (fp && fp.selectedDates.length === 2) {
    s = format(fp.selectedDates[0]);
    e = format(fp.selectedDates[1]);
  }

  // 6. 서버로 전 지점 데이터 요청
  google.script.run
    .withSuccessHandler(function(responseStr) {
      try {
        const data = JSON.parse(responseStr);
        mapEl.innerHTML = ''; // 로딩 스피너 제거

        // 지도 생성
        window._leafletMap = L.map('map-container', {
          center: currentCenter,
          zoom: currentZoom,
          zoomControl: true,
          scrollWheelZoom: true
        });

        // Google 위성 타일 레이어 (Hybrid: 위성 + 지명/도로명)
        L.tileLayer('http://mt0.google.com/vt/lyrs=y&hl=kr&x={x}&y={y}&z={z}', {
          maxZoom: 18,
          attribution: '&copy; Google'
        }).addTo(window._leafletMap);

        // 주요 지점 전용 Pane 생성 (일반 마커보다 항상 위에 오도록 Z-Index 설정)
        window._leafletMap.createPane('majorMarkerPane');
        window._leafletMap.getPane('majorMarkerPane').style.zIndex = 610; // 일반 overlayPane은 400
        
        window._leafletMap.createPane('majorTooltipPane');
        window._leafletMap.getPane('majorTooltipPane').style.zIndex = 660; // 일반 tooltipPane은 650

        const MAJOR_CITIES = ['과천', '여주', '이천', '양평', '화성', '수원', '연천', '포천', '파주', '고양', '강화', '옹진', '백령도', '김포', '평택', '안성'];
        
        const majorLayer = L.layerGroup();
        const subLayer = L.layerGroup();

        // 91개 마커 추가
        data.forEach(d => {
          if (!d.lat || !d.lon) return;
          
          const isMajor = MAJOR_CITIES.includes(d.name);
          const circleColor = isMajor ? '#e11d48' : '#3b82f6'; // 주요지점은 눈에 띄는 빨간/자주색
          
          const circleMarker = L.circleMarker([d.lat, d.lon], {
            pane: isMajor ? 'majorMarkerPane' : 'overlayPane',
            radius: isMajor ? 5 : 4,
            color: '#ffffff',
            weight: 1,
            fillColor: circleColor,
            fillOpacity: 0.9
          });
          
          const titleColor = isMajor ? '#be123c' : '#334155';
          const tooltipContent = `
            <div class="custom-map-tooltip" style="font-family: 'Noto Sans KR', sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; white-space: nowrap;">
              <div style="font-size: 13px; font-weight: 800; color: ${titleColor}; line-height: 1.4;">
                [ ${d.name} ] 
                <span style="color: #2563eb; margin-left: 2px;">${d.totalPrecip}</span><span style="color: #94a3b8; margin: 0 2px;">/</span><span style="color: #0284c7;">${d.next24hPrecip}</span><span style="color: #94a3b8; margin: 0 2px;">/</span><span style="color: #d97706;">${d.next10dPrecip}</span>
              </div>
              <div class="tooltip-detail" style="margin-top: 6px; border-top: 1px dashed #cbd5e1; padding-top: 6px; width: 100%;">
                <table style="width: 100%; font-size: 11px; text-align: left; border-collapse: collapse;">
                  <tr>
                    <td style="color: #64748b; padding-right: 8px; font-weight: 500;">${window.getPeriodText(s, e)}</td>
                    <td style="color: #94a3b8; width: 10px; text-align: center;">:</td>
                    <td style="color: #2563eb; font-weight: 700; text-align: right; padding-left: 8px;">${d.totalPrecip} <span style="font-size: 9px; font-weight: normal; color: #94a3b8;">mm</span></td>
                  </tr>
                  <tr>
                    <td style="color: #64748b; padding-right: 8px; font-weight: 500;">24시간 예상</td>
                    <td style="color: #94a3b8; width: 10px; text-align: center;">:</td>
                    <td style="color: #0284c7; font-weight: 700; text-align: right; padding-left: 8px;">${d.next24hPrecip} <span style="font-size: 9px; font-weight: normal; color: #94a3b8;">mm</span></td>
                  </tr>
                  <tr>
                    <td style="color: #64748b; padding-right: 8px; font-weight: 500;">10일 예상</td>
                    <td style="color: #94a3b8; width: 10px; text-align: center;">:</td>
                    <td style="color: #d97706; font-weight: 700; text-align: right; padding-left: 8px;">${d.next10dPrecip} <span style="font-size: 9px; font-weight: normal; color: #94a3b8;">mm</span></td>
                  </tr>
                </table>
              </div>
            </div>
          `;
          
          circleMarker.bindTooltip(tooltipContent, { 
            pane: isMajor ? 'majorTooltipPane' : 'tooltipPane',
            permanent: true, 
            interactive: true,
            direction: 'bottom',
            offset: [0, 5],
            opacity: 0.95
          });
          
          if (isMajor) {
            majorLayer.addLayer(circleMarker);
          } else {
            subLayer.addLayer(circleMarker);
          }
        });

        // 초기에는 주요 지점만 렌더링
        majorLayer.addTo(window._leafletMap);
        
        // 줌 레벨에 따른 읍면동 마커 동적 토글 (임계치: 10)
        const ZOOM_THRESHOLD = 10;
        if (window._leafletMap.getZoom() >= ZOOM_THRESHOLD) {
          window._leafletMap.addLayer(subLayer);
        }
        
        window._leafletMap.on('zoomend', function() {
          if (window._leafletMap.getZoom() >= ZOOM_THRESHOLD) {
            if (!window._leafletMap.hasLayer(subLayer)) {
              window._leafletMap.addLayer(subLayer);
            }
          } else {
            if (window._leafletMap.hasLayer(subLayer)) {
              window._leafletMap.removeLayer(subLayer);
            }
          }
        });

        window._leafletMap.invalidateSize();

      } catch (err) {
        console.error('[showMapModal] 데이터 렌더링 실패:', err);
        mapEl.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:8px; color:#ef4444;">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;"></i>
            <p style="font-size:13px; font-weight:600;">지도 렌더링에 실패했습니다.</p>
          </div>
        `;
      }
    })
    .withFailureHandler(function(err) {
      console.error('[showMapModal] 서버 통신 실패:', err);
      mapEl.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:8px; color:#ef4444;">
          <i class="fa-solid fa-wifi" style="font-size:2rem;"></i>
          <p style="font-size:13px; font-weight:600;">데이터 통신에 실패했습니다.</p>
          <p style="font-size:11px; color:#94a3b8;">${err.message}</p>
        </div>
      `;
    })
    .getAllMapDataFromCache(s, e);
}

window.toggleModalFullscreen = function() {
  const modalBox = document.querySelector('#detail-modal > div');
  const icon = document.getElementById('modal-fs-icon');
  
  modalBox.classList.toggle('modal-fullscreen');
  
  if (modalBox.classList.contains('modal-fullscreen')) {
    icon.classList.remove('fa-expand');
    icon.classList.add('fa-compress');
  } else {
    icon.classList.remove('fa-compress');
    icon.classList.add('fa-expand');
  }
};
</script>
